<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Figurative: an animal seen from behind (rump + two back legs) with an arrow pointing at the TAIL. -->
  <!-- tail: ink stroke behind, sand stroke on top => an outlined limb (same technique as shin.svg) -->
  <path d="M56 46 Q76 38 82 20 Q86 8 74 10" fill="none" stroke="#3d3833" stroke-width="12" stroke-linecap="round"/>
  <path d="M56 46 Q76 38 82 20 Q86 8 74 10" fill="none" stroke="#c9b48f" stroke-width="7" stroke-linecap="round"/>
  <!-- back legs (drawn first so the rump sits over their tops) -->
  <rect x="10" y="68" width="14" height="28" rx="6" fill="#c9b48f" stroke="#3d3833" stroke-width="2.5"/>
  <rect x="42" y="68" width="14" height="28" rx="6" fill="#c9b48f" stroke="#3d3833" stroke-width="2.5"/>
  <!-- rump -->
  <path d="M6 80 V58 Q6 30 34 30 Q60 30 62 58 V80 Q34 86 6 80 Z" fill="#c9b48f" stroke="#3d3833" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- arrow: from the right, tip on the tail -->
  <path d="M96 50 L76 38" fill="none" stroke="#3d3833" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M76 38 L85 38 M76 38 L80 46" fill="none" stroke="#3d3833" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
