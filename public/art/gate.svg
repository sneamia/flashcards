<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- A garden gate: two capped posts, an arched row of pointed pickets, two rails, a latch ring. -->
  <!-- posts -->
  <rect x="6" y="20" width="12" height="70" rx="2" fill="#8a6a4a" stroke="#3d3833" stroke-width="2.5"/>
  <rect x="82" y="20" width="12" height="70" rx="2" fill="#8a6a4a" stroke="#3d3833" stroke-width="2.5"/>
  <rect x="4" y="16" width="16" height="7" rx="1.5" fill="#a6785a" stroke="#3d3833" stroke-width="2.5"/>
  <rect x="80" y="16" width="16" height="7" rx="1.5" fill="#a6785a" stroke="#3d3833" stroke-width="2.5"/>
  <!-- pickets (arched: centre tallest), pointed tops -->
  <path d="M22 90 V48 L27 41 L32 48 V90 Z" fill="#c9b48f" stroke="#3d3833" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M34 90 V41 L39 34 L44 41 V90 Z" fill="#c9b48f" stroke="#3d3833" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M46 90 V36 L51 29 L56 36 V90 Z" fill="#c9b48f" stroke="#3d3833" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M58 90 V41 L63 34 L68 41 V90 Z" fill="#c9b48f" stroke="#3d3833" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M70 90 V48 L75 41 L80 48 V90 Z" fill="#c9b48f" stroke="#3d3833" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- rails -->
  <rect x="19" y="52" width="62" height="7" rx="1.5" fill="#a6785a" stroke="#3d3833" stroke-width="2.5"/>
  <rect x="19" y="74" width="62" height="7" rx="1.5" fill="#a6785a" stroke="#3d3833" stroke-width="2.5"/>
  <!-- latch ring on the right post -->
  <circle cx="76" cy="66" r="4" fill="none" stroke="#3d3833" stroke-width="2.5"/>
  <!-- ground -->
  <path d="M2 92 H98" fill="none" stroke="#3d3833" stroke-width="2.5" stroke-linecap="round"/>
</svg>
